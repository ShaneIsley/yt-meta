[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-meta"
version = "0.8.0"
description = "A lightweight library for fetching YouTube metadata."
readme = "README.md"
authors = [{ name = "Shane", email = "shane.isley@gmail.com" }]
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
    "httpx",
    "dateparser",
    "youtube-transcript-api>=1.1.0",
]

[project.optional-dependencies]
persistent_cache = ["diskcache>=5.6.3"]

[project.urls]
Homepage = "https://github.com/shaneisley/yt-meta"
Repository = "https://github.com/shaneisley/yt-meta"
Issues = "https://github.com/shaneisley/yt-meta/issues"
Changelog = "https://github.com/shaneisley/yt-meta/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["yt_meta*"]

[tool.setuptools.package-data]
yt_meta = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Default to an offline run. Two markers hit the network / PyPI and are
# excluded by default: `contract` (the structural live contract — run with
# `pytest -m contract`) and `pypi` (installs the PUBLISHED package from PyPI
# and smoke-tests it — run with `pytest -m pypi`). See H12 in the v0.5.0
# changelog. (The older `integration` marker's value-asserting network tests
# were retired; the marker is gone.)
addopts = "-v -m 'not contract and not pypi'"
markers = [
    "contract: live structural contract test — rarely run, asserts the shape YouTube returns (run with `pytest -m contract`)",
    "pypi: installs yt-meta from PyPI into an isolated venv and smoke-tests the published artifact (run with `pytest -m pypi`)",
]
filterwarnings = [
    "ignore:Parsing dates involving a day of month without a year specified is ambiguous:DeprecationWarning",
]

# The single source of truth for dev tooling. `uv sync` / `uv run` install
# this group by default, so `make lint` / `make check` work on a fresh clone
# without a globally-installed ruff.
[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.1",
    "ruff>=0.15.20",
    "tqdm>=4.67.1",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # Line too long, handled by black
]

[tool.uv.sources]
yt-meta = { path = ".", editable = true }

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-meta"
version = "0.8.0"
description = "A lightweight library for fetching YouTube metadata."
readme = "README.md"
authors = [{ name = "Shane", email = "shane.isley@gmail.com" }]
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.10"
dependencies = [
    "httpx",
    "dateparser",
    "youtube-transcript-api>=1.1.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "pytest-mock", "ruff", "tqdm"]
persistent_cache = ["diskcache>=5.6.3"]

[project.urls]
Homepage = "https://github.com/shaneisley/yt-meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["yt_meta*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Default to an offline run. Three markers hit the network / PyPI and are
# excluded by default: `integration` (the older, value-asserting network
# tests), `contract` (the structural live contract — run with
# `pytest -m contract`), and `pypi` (installs the PUBLISHED package from PyPI
# and smoke-tests it — run with `pytest -m pypi`). See H12 in the v0.5.0
# changelog.
addopts = "-v -m 'not integration and not contract and not pypi'"
markers = [
    "integration: marks tests as integration tests (makes network requests)",
    "contract: live structural contract test — rarely run, asserts the shape YouTube returns (run with `pytest -m contract`)",
    "pypi: installs yt-meta from PyPI into an isolated venv and smoke-tests the published artifact (run with `pytest -m pypi`)",
]
filterwarnings = [
    "ignore:Parsing dates involving a day of month without a year specified is ambiguous:DeprecationWarning",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-mock>=3.14.1",
    "tqdm>=4.67.1",
]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
# ... existing code ...

[tool.ruff.lint]
# By default, ruff will lint all files in the current directory and its subdirectories
# except for those that are excluded by .gitignore, .ignore, .ruff_ignore, or global-exclude.
# You can override this behavior by specifying the `select` option.
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # Line too long, handled by black
]

[tool.uv.sources]
yt-meta = { path = ".", editable = true }
